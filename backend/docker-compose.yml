version: '3.9'

services:

  db:
    image: postgres:15
    container_name: focusarena_db
    restart: always
    environment:
      POSTGRES_DB: focusarena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ashika@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: focusarena_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: focusarena_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data: